[workspace]
members = ["crates/pov-api", "crates/pov-core", "crates/pov-platform"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.95"

[workspace.dependencies]
argon2 = { version = "0.5.3", default-features = false, features = [
  "alloc",
  "password-hash",
  "zeroize",
] }
axum = "0.8.9"
base64ct = { version = "1.8.3", features = ["alloc"] }
ed25519-dalek = { version = "3.0.0", default-features = false, features = [
  "fast",
  "zeroize",
] }
getrandom = "0.4.3"
mime_guess = "2.0.5"
process-wrap = { version = "9.1.0", default-features = false, features = [
  "kill-on-drop",
  "process-group",
  "tokio1",
] }
rust-embed = { version = "8.12.0", features = ["debug-embed"] }
rustix = { version = "1.1.4", features = ["fs", "process"] }
sha2 = "0.11.0"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = [
  "io-util",
  "macros",
  "net",
  "process",
  "rt-multi-thread",
  "sync",
  "time",
] }
tokio-rusqlite = { version = "0.7.0", features = ["backup", "bundled", "hooks"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
tower = { version = "0.5.3", features = ["util"] }
unicode-normalization = "0.1.25"
uuid = { version = "1.24.0", features = ["v4"] }
zeroize = "1.9.0"
